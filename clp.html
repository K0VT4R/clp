<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odliczanie - Klepsydra</title>
    <!-- Importujemy pikselową czcionkę z Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace; /* Pikselowa czcionka */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* Pikselowa Klepsydra - stworzona za pomocą prostych bloków (div) */
        .hourglass {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .wood-cap {
            width: 140px;
            height: 20px;
            background-color: #5c3a21; /* Ciemne drewno */
            border: 4px solid #3e2723;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3), inset 4px 4px 0px rgba(255,255,255,0.1);
        }

        .glass-container {
            width: 100px;
            height: 120px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 4px solid #a2c2e6; /* Jasne szkło */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .glass-top {
            border-bottom: none;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }

        .glass-bottom {
            border-top: none;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
            align-items: flex-end;
        }

        .sand {
            width: 100%;
            background-color: #ffd700; /* Żółty piasek */
            /* Cień imitujący piksele i fakturę piasku */
            box-shadow: inset -4px -4px 0px rgba(200, 150, 0, 0.8); 
            transition: height 1s ease-in-out;
        }

        .neck {
            width: 20px;
            height: 15px;
            background-color: #a2c2e6;
            position: relative;
        }
        
        .falling-sand {
            position: absolute;
            width: 6px;
            height: 15px;
            background-color: #ffd700;
            left: 50%;
            transform: translateX(-50%);
            display: none; /* Animacja opadania włączana w JS */
        }

        /* Sekcja odliczania */
        .countdown-title {
            font-size: 14px;
            margin-bottom: 20px;
            color: #dcdcdc;
            line-height: 1.5;
        }

        .timer-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .square {
            background-color: #333;
            border: 4px solid #555;
            padding: 15px;
            font-size: 24px;
            min-width: 40px;
            margin-bottom: 10px;
            box-shadow: 4px 4px 0px #000;
        }

        .label {
            font-size: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Klepsydra -->
    <div class="hourglass">
        <div class="wood-cap"></div>
        <div class="glass-container glass-top">
            <!-- Piasek górny (na początku pełny) -->
            <div id="top-sand" class="sand" style="height: 100%;"></div>
        </div>
        <div class="neck">
            <div id="falling-sand" class="falling-sand"></div>
        </div>
        <div class="glass-container glass-bottom">
            <!-- Piasek dolny (na początku pusty) -->
            <div id="bottom-sand" class="sand" style="height: 0%;"></div>
        </div>
        <div class="wood-cap"></div>
    </div>

    <!-- Licznik -->
    <div class="countdown-title">Koniec odliczania za:</div>
    
    <div class="timer-container">
        <div class="time-box">
            <div id="days" class="square">00</div>
            <div class="label">DNI</div>
        </div>
        <div class="time-box">
            <div id="hours" class="square">00</div>
            <div class="label">GODZIN</div>
        </div>
        <div class="time-box">
            <div id="minutes" class="square">00</div>
            <div class="label">MINUT</div>
        </div>
        <div class="time-box">
            <div id="seconds" class="square">00</div>
            <div class="label">SEKUND</div>
        </div>
    </div>

    <script>
        // Ustawienia dat (zmień datę początkową na realny moment powstania strony)
        const endDate = new Date('2027-06-30T00:00:00').getTime();
        const startDate = new Date('2026-10-22T00:00:00').getTime(); 

        const msInWeek = 1000 * 60 * 60 * 24 * 7;
        const totalDuration = endDate - startDate;
        const totalWeeks = Math.floor(totalDuration / msInWeek);

        function updateTimer() {
            const now = new Date().getTime();
            const distance = endDate - now;

            // Zabezpieczenie, gdy czas dobiegnie końca
            if (distance <= 0) {
                document.getElementById('days').innerText = "0";
                document.getElementById('hours').innerText = "0";
                document.getElementById('minutes').innerText = "0";
                document.getElementById('seconds').innerText = "0";
                updateSand(1); // 100% przelane
                document.getElementById('falling-sand').style.display = 'none';
                return;
            }

            // Obliczenia czasu
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Aktualizacja HTML (dodaje zera z przodu jeśli potrzeba, opcjonalnie można usunąć padStart)
            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
            document.getElementById('falling-sand').style.display = 'block';

            // Logika piasku (aktualizacja TYLKO co tydzień w sensie upłyniętych równych tygodni)
            const elapsed = now - startDate;
            let weeksElapsed = Math.floor(elapsed / msInWeek);
            
            if (weeksElapsed < 0) weeksElapsed = 0;
            if (weeksElapsed > totalWeeks) weeksElapsed = totalWeeks;

            let sandPercentage = weeksElapsed / totalWeeks;
            updateSand(sandPercentage);
        }

        function updateSand(percent) {
            const topSand = document.getElementById('top-sand');
            const bottomSand = document.getElementById('bottom-sand');

            // Górny piasek maleje z 100% do 0%
            topSand.style.height = (100 - (percent * 100)) + '%';
            // Dolny piasek rośnie z 0% do 100%
            bottomSand.style.height = (percent * 100) + '%';
        }

        // Odświeżaj timer co 1 sekundę
        setInterval(updateTimer, 1000);
        updateTimer(); // wywołanie natychmiastowe przy starcie
    </script>
</body>
</html>
