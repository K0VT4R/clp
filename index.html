<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odliczanie - Klepsydra</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .hourglass {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .wood-cap {
            width: 140px;
            height: 20px;
            background-color: #5c3a21;
            border: 4px solid #3e2723;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3), inset 4px 4px 0px rgba(255,255,255,0.1);
            z-index: 2;
        }

        .glass-container {
            width: 100px;
            height: 120px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 4px solid #a2c2e6;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .glass-top {
            border-bottom: none;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }

        .glass-bottom {
            border-top: none;
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
            align-items: flex-end;
        }

        .sand {
            width: 100%;
            background-color: #ffd700;
            box-shadow: inset -4px -4px 0px rgba(200, 150, 0, 0.8); 
            transition: height 1s ease-in-out;
            z-index: 1;
        }

        .neck {
            width: 20px;
            height: 15px;
            background-color: #a2c2e6;
            position: relative;
            z-index: 3;
        }
        
        /* Kontener na animowane ziarenka */
        .falling-sand-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
            z-index: 0;
        }

        /* Pojedyncze ziarenko piasku (piksel) */
        .grain {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #ffd700;
            top: 0;
            left: 0;
            animation: fall 1.5s steps(6) forwards; /* Używamy steps by wymusić rwanie pikselowe */
        }

        /* Animacja zygzakowata w dół */
        @keyframes fall {
            0% { transform: translate(0px, 0px); opacity: 1; }
            20% { transform: translate(-6px, 20px); }
            40% { transform: translate(6px, 40px); }
            60% { transform: translate(-6px, 60px); }
            80% { transform: translate(6px, 80px); }
            95% { transform: translate(0px, 100px); opacity: 1; }
            100% { transform: translate(0px, 110px); opacity: 0; }
        }

        .countdown-title {
            font-size: 14px;
            margin-bottom: 20px;
            color: #dcdcdc;
            line-height: 1.5;
        }

        .timer-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .square {
            background-color: #333;
            border: 4px solid #555;
            padding: 15px;
            font-size: 24px;
            min-width: 40px;
            margin-bottom: 10px;
            box-shadow: 4px 4px 0px #000;
        }

        .label {
            font-size: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="hourglass">
        <div class="wood-cap"></div>
        <div class="glass-container glass-top">
            <div id="top-sand" class="sand" style="height: 100%;"></div>
        </div>
        <div class="neck"></div>
        <div class="glass-container glass-bottom">
            <!-- Pusty div pełniący rolę toru dla opadających ziarenek -->
            <div id="falling-sand-container" class="falling-sand-container"></div>
            <div id="bottom-sand" class="sand" style="height: 0%;"></div>
        </div>
        <div class="wood-cap"></div>
    </div>

    <div class="countdown-title">Koniec odliczania za:</div>
    
    <div class="timer-container">
        <div class="time-box">
            <div id="days" class="square">00</div>
            <div class="label">DNI</div>
        </div>
        <div class="time-box">
            <div id="hours" class="square">00</div>
            <div class="label">GODZIN</div>
        </div>
        <div class="time-box">
            <div id="minutes" class="square">00</div>
            <div class="label">MINUT</div>
        </div>
        <div class="time-box">
            <div id="seconds" class="square">00</div>
            <div class="label">SEKUND</div>
        </div>
    </div>

    <script>
        const endDate = new Date('2027-06-30T00:00:00').getTime();
        const startDate = new Date('2026-10-22T00:00:00').getTime(); 
        const msInWeek = 1000 * 60 * 60 * 24 * 7;
        const totalDuration = endDate - startDate;
        const totalWeeks = Math.floor(totalDuration / msInWeek);
        let timerEnded = false;

        function updateTimer() {
            const now = new Date().getTime();
            const distance = endDate - now;

            if (distance <= 0) {
                document.getElementById('days').innerText = "0";
                document.getElementById('hours').innerText = "0";
                document.getElementById('minutes').innerText = "0";
                document.getElementById('seconds').innerText = "0";
                updateSand(1); 
                timerEnded = true;
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');

            const elapsed = now - startDate;
            let weeksElapsed = Math.floor(elapsed / msInWeek);
            
            if (weeksElapsed < 0) weeksElapsed = 0;
            if (weeksElapsed > totalWeeks) weeksElapsed = totalWeeks;

            let sandPercentage = weeksElapsed / totalWeeks;
            updateSand(sandPercentage);
        }

        function updateSand(percent) {
            const topSand = document.getElementById('top-sand');
            const bottomSand = document.getElementById('bottom-sand');
            topSand.style.height = (100 - (percent * 100)) + '%';
            bottomSand.style.height = (percent * 100) + '%';
        }

        // --- Nowa funkcjonalność: Tworzenie ziarenek ---
        function spawnGrain() {
            if (timerEnded) return; // Przestań generować piasek gdy czas minie
            
            const container = document.getElementById('falling-sand-container');
            const grain = document.createElement('div');
            grain.classList.add('grain');
            
            // Dodaj ziarenko do kontenera
            container.appendChild(grain);
            
            // Usuń ziarenko po zakończeniu animacji (1500 ms) by nie zaśmiecać kodu HTML
            setTimeout(() => {
                grain.remove();
            }, 1500);
        }

        setInterval(updateTimer, 1000);
        // Odpalaj nowe ziarenko co 500 ms
        setInterval(spawnGrain, 500);
        
        updateTimer(); 
    </script>
</body>
</html>
